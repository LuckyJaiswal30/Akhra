name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://akhra:akhra@localhost:5432/akhra
  INVITE_SIGNING_SECRET: ci-placeholder-invite-signing-secret-not-used
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: akhra
          POSTGRES_PASSWORD: akhra
          POSTGRES_DB: akhra
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and RLS tests
        run: pnpm test

      - name: Production-safety checks
        run: pnpm check:no-hardcoded-urls

      - name: Colour contrast (WCAG AA)
        run: pnpm --filter @akhra/web contrast

      - name: Verify migrations are committed
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Schema changed but migrations were not regenerated. Run 'pnpm db:generate' and commit the result."
            git --no-pager diff --stat packages/db/migrations
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3100

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: akhra
          POSTGRES_PASSWORD: akhra
          POSTGRES_DB: akhra
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Install the browser
        run: pnpm --filter @akhra/web test:browser:install

      - name: Public pages, both languages, phone and desktop
        run: pnpm test:browser

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
